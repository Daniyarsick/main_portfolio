server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|pdf|doc|docx|ppt|pptx|xls|xlsx|zip|rar|mp3|mp4)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
